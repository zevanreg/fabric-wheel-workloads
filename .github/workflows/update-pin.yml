name: Update library release pin

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable library tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: library-release-pin
  cancel-in-progress: false

jobs:
  update-pin:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require PR credentials
        env:
          PIN_PR_TOKEN: ${{ secrets.PIN_PR_TOKEN }}
        run: |
          if [[ -z "$PIN_PR_TOKEN" ]]; then
            echo "Configure PIN_PR_TOKEN with Contents and Pull requests write access." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Update pin from verified published assets
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/release_pin.py --update-tag "$RELEASE_TAG"
      - name: Expose verified pin
        id: pin
        run: python scripts/release_pin.py
      - name: Install offline test dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Test proposed pin
        run: python -m unittest discover -s tests -v
      - name: Open or update pin-only PR
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PIN_PR_TOKEN }}
          base: dev
          branch: automation/library-release-pin/${{ steps.pin.outputs.tag }}
          add-paths: release.json
          commit-message: "Update demo-date pin to ${{ steps.pin.outputs.tag }}"
          title: "Update demo-date pin to ${{ steps.pin.outputs.tag }}"
          body: |
            Published release: https://github.com/${{ steps.pin.outputs.repository }}/releases/tag/${{ steps.pin.outputs.tag }}
            Wheel: `${{ steps.pin.outputs.asset }}`
            SHA-256: `${{ steps.pin.outputs.sha256 }}`

            Verified the stable release, published SHA256SUMS, wheel checksum, and package metadata.
            Review this pin before merging into dev. Deployment and promotion remain unchanged.
      - name: Report pull request
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          if [[ -n "$PR_URL" ]]; then
            printf 'Pin update PR: %s\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The release pin is already current; no PR changes needed." >> "$GITHUB_STEP_SUMMARY"
          fi